services:
  mongodb1:
    image: mongo:7.0
    volumes:
      - mongodb1_data_container:/data/db

  pymongo_api:
    image: kazhem/pymongo_api:1.0.0
    depends_on:
      - mongodb1
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MONGODB_URL: "mongodb://mongodb1"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  mongodb1_data_container:
